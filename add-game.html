<body data-page="add-game">
  <script>
    document.documentElement.classList.remove('dark');
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
  </script>
  <div id="root">
    <div class="catalog-loader-container" role="status" aria-label="Загрузка формы">
      <div class="catalog-spinner"></div>
    </div>
  </div>

  <script>
    Babel.registerPreset('classic-jsx', {
      presets: [[Babel.availablePresets.react, { runtime: 'classic' }]]
    });
  </script>
  <script type="text/babel" data-presets="classic-jsx" src="app.js?v=20261015-theme-fixed"></script>
</body>
